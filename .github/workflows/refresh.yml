name: refresh-reviews
on:
  schedule: [{cron: "0 18 * * *"}]   # 04:00 AEST daily
  workflow_dispatch: {}
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 refresh_all.py
        env:
          GBP_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GBP_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GBP_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
      - if: always()
        run: |
          git config user.name "reviews-bot"; git config user.email "actions@users.noreply.github.com"
          git add reviews/*.json && git commit -m "Refresh reviews $(date -u +%F)" && git push || echo "no changes"
